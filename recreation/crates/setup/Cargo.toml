[package]
name = "jawjack-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Per-user Jawjack installer/uninstaller (no admin, no external tools).
# Ported from Haiwire's apps/haiwire-setup. The release packager
# (scripts/Package-Release.py) appends the verified application payload to
# this executable; a build without that payload refuses to install.
#
# This crate does not inherit the workspace lints: it calls Win32 (registry,
# shell links, task dialogs, CNG) and therefore needs `unsafe`. Every unsafe
# block carries a SAFETY comment.
[[bin]]
name = "jawjack-setup"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
flate2 = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
