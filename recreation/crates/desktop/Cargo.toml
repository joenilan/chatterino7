[package]
name = "chat-workbench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[dependencies]
chat-core = { path = "../chat-core" }
gpui-kit = "=0.7.1"
serde_json = "=1.0.151"
chrono = "=0.4.45"
unicode-segmentation = "=1.13.3"
regex = "1.13"
semver = "=1.0.28"
sha2 = "=0.10.9"
base64 = "=0.22.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
image = { version = "=0.25.10", default-features = false, features = ["gif", "png", "webp", "jpeg"] }
rodio = { version = "=0.20.1", default-features = false, features = ["wav"] }
spellbook = "=0.4.2"
getrandom = "=0.3.4"
jawjack-taskbar = { path = "../taskbar" }
raw-window-handle = "=0.6.2"
[lints]
workspace = true
