[workspace]
members = ["crates/chat-core", "crates/desktop", "crates/setup", "crates/taskbar"]
default-members = ["crates/chat-core"]
resolver = "3"

[workspace.package]
version = "0.1.0-preview.8"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
