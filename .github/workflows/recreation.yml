name: Rust recreation
on:
  push:
    branches: ["recreation/**"]
    paths: ["recreation/**", ".github/workflows/recreation.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recreation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: recreation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.99.0
      - run: cargo fmt --all --check
      - run: cargo test -p chat-core --locked
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo build -p chat-workbench --release --locked
